<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

        <link rel="stylesheet" href="{{ url_for('static', filename='page-style.css') }}">
    </head>
    <body>

        <form action="/stats" method="post">
            <label>
                How high did you jump in meters?:  
                <input type="text" name="jump-height"/>
            </label>
            <button type="submit">Submit</button>
            
        </form>

        <table class="jump-table">
            <thead>
                <tr>
                    <th>Jump Height</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1.72m</td>
                    <td>August 12th</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
